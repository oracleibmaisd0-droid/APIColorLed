<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selector de Color</title>
    <link rel="icon" href="https://raw.githubusercontent.com/IMAGESARCH/Color/refs/heads/main/Color.png">
    <link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">
    <style>
        /* Estilos generales */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: background-color 0.5s ease-in-out; /* Suaviza el cambio de color */
        }

        /* Contenedor de botones de color */
        .botones {
            position: fixed;
            top: 50px; /* Separado un poco del top para no solaparse con el botón de pantalla completa */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            flex-direction: column;
            align-items: center;
        }

/* Contenedor de botones de colores */
.color-buttons {
    display: flex;
    gap: 10px;
    width: min(100%, 390px);
    box-sizing: border-box;
    overflow-x: auto;
    flex-wrap: nowrap;
    justify-content: flex-start;
    padding: 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    touch-action: none;
    user-select: none;
    cursor: grab;
}

.color-buttons::-webkit-scrollbar {
    display: none;
}

        /* Estilos de los botones */
        .boton {
            width: 50px;
            height: 50px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            flex: 0 0 50px;
        }

        /* Colores de los botones */
        .rojo { background-color: red; }
        .naranja { background-color: orange; }
        .amarillo { background-color: yellow; }
        .verde { background-color: green; }
        .azul { background-color: blue; }
        
        /* Botón multicolor con gradiente arcoíris */
        .multicolor {
            background: linear-gradient(90deg, red, orange, yellow, green, blue, purple);
        }

        /* Estilos para los botones de pantalla completa y zoom */
        #fullscreenButton, #zoomInButton, #zoomOutButton {
            position: fixed;
            top: 10px;
            padding: 10px 15px;
            font-size: 16px;
            font-family: 'Product Sans', sans-serif;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
        }

        /* Estilos del botón de pantalla completa */
        #fullscreenButton {
            right: 10px;
            background-color: #007bff;
            color: white;
            border: none;
        }

        #fullscreenButton:hover {
            background-color: #0056b3;
        }

        /* Estilos para los botones de zoom */
        #zoomInButton {
            left: 10px;
            background-color: #28a745;
            color: white;
            border: none;
        }

        #zoomInButton:hover {
            background-color: #218838;
        }

        #zoomOutButton {
            left: 110px;
            background-color: red;
            color: white;
            border: none;
        }

        #zoomOutButton:hover {
            background-color: darkred;
        }
        
        

        /* Estilo Powered by Oracle */
        .powered {
            margin-top: 10px;
            color: black;
            font-family: 'Product Sans', sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Botón de Pantalla Completa -->
    <button id="fullscreenButton" onclick="toggleFullScreen()">Pantalla Completa</button>

    <!-- Botones de Zoom -->
    <button id="zoomInButton" onclick="zoomIn()">Zoom In</button>
    <button id="zoomOutButton" onclick="zoomOut()">Zoom Out</button>

    <!-- Contenedor de botones de colores -->
    <div class="botones">
<div class="color-buttons">
    <button class="boton rojo" aria-label="Rojo"></button>
    <button class="boton naranja" aria-label="Naranja"></button>
    <button class="boton amarillo" aria-label="Amarillo"></button>
    <button class="boton verde" aria-label="Verde"></button>
    <button class="boton azul" aria-label="Azul"></button>
    <button class="boton multicolor" aria-label="Multicolor"></button>
</div>

    <script>
        let intervaloMulticolor;
        let currentZoom = 1;

        // Función para cambiar el color de fondo
        function cambiarColor(color) {
            clearInterval(intervaloMulticolor); // Detiene el efecto multicolor si está activo
            document.body.style.backgroundColor = color;
        }

        // Función para activar el modo multicolor
        function modoMulticolor() {
            clearInterval(intervaloMulticolor); // Evita múltiples intervalos
            const colores = ["red", "orange", "yellow", "green", "blue", "purple"];
            let index = 0;

            intervaloMulticolor = setInterval(() => {
                document.body.style.backgroundColor = colores[index];
                index = (index + 1) % colores.length;
            }, 500);
        }

        // Función para activar/desactivar el modo pantalla completa
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) { // Firefox
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.webkitRequestFullscreen) { // Chrome, Safari y Opera
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) { // IE/Edge
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) { // Firefox
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) { // Chrome, Safari y Opera
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { // IE/Edge
                    document.msExitFullscreen();
                }
            }
        }

        // Función para aumentar el zoom
        function zoomIn() {
            currentZoom += 0.1;
            document.body.style.transform = `scale(${currentZoom})`;
        }

        // Función para reducir el zoom
        function zoomOut() {
            currentZoom -= 0.1;
            document.body.style.transform = `scale(${currentZoom})`;
        }
    </script>


<script type="module">
import {
    glass,
    attachPress
} from "https://cdn.jsdelivr.net/npm/glassy-liquid@0.1.0/+esm";

// =====================================
// LIQUID GLASS - TODOS LOS BOTONES
// =====================================

document.querySelectorAll("button").forEach(elemento => {
    const superficie = glass(elemento, {
        radius: 8,
        material: "clear",
        appearance: "dark",
        refraction: 18
    });

    attachPress(elemento, superficie);
});

// =====================================
// SONIDO MECÁNICO DE LA RULETA
// =====================================

let audioContext = null;

const SOUND_FREQUENCY = 10000;
const SOUND_DURATION = 0.010;
const VIBRATION_DURATION = 10;

function playTick() {
    try {
        if (!audioContext) {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const duration = SOUND_DURATION;
        const now = audioContext.currentTime;

        const buffer = audioContext.createBuffer(
            1,
            Math.ceil(audioContext.sampleRate * duration),
            audioContext.sampleRate
        );

        const data = buffer.getChannelData(0);

        for (let i = 0; i < data.length; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const source = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const volume = audioContext.createGain();

        source.buffer = buffer;

        filter.type = "highpass";
        filter.frequency.value = SOUND_FREQUENCY;

        volume.gain.setValueAtTime(0.12, now);
        volume.gain.exponentialRampToValueAtTime(
            0.001,
            now + duration
        );

        source.connect(filter);
        filter.connect(volume);
        volume.connect(audioContext.destination);

        source.start(now);
        source.stop(now + duration);

    } catch (error) {
        console.warn("No se pudo reproducir el sonido:", error);
    }
}

// =====================================
// ACTIVACIÓN Y VIBRACIÓN DE COLORES
// =====================================

const palette = document.querySelector(".color-buttons");

let activeButton = null;
let startX = 0;
let startScrollLeft = 0;
let ignoreClick = false;

function selectColorButton(button) {
    if (!button || button === activeButton) return;

    activeButton = button;

    if (button.classList.contains("multicolor")) {
        modoMulticolor();
    } else {
        const colors = {
            rojo: "red",
            naranja: "orange",
            amarillo: "yellow",
            verde: "green",
            azul: "blue"
        };

        const colorClass = Object.keys(colors).find(
            name => button.classList.contains(name)
        );

        if (colorClass) {
            cambiarColor(colors[colorClass]);
        }
    }

    playTick();

    if (navigator.vibrate) {
        navigator.vibrate(VIBRATION_DURATION);
    }
}

// =====================================
// DESPLAZAMIENTO TÁCTIL Y CON RATÓN
// =====================================

palette.addEventListener("pointerdown", event => {
    const button = event.target.closest(".boton");

    if (!button) return;

    palette.setPointerCapture(event.pointerId);

    startX = event.clientX;
    startScrollLeft = palette.scrollLeft;

    activeButton = null;
    ignoreClick = true;

    selectColorButton(button);
});

palette.addEventListener("pointermove", event => {
    if (!palette.hasPointerCapture(event.pointerId)) return;

    const distance = event.clientX - startX;

    palette.scrollLeft = startScrollLeft - distance;

    const element = document.elementFromPoint(
        event.clientX,
        event.clientY
    );

    const button = element?.closest(".boton");

    if (button && palette.contains(button)) {
        selectColorButton(button);
    }
});

palette.addEventListener("pointerup", event => {
    if (palette.hasPointerCapture(event.pointerId)) {
        palette.releasePointerCapture(event.pointerId);
    }

    activeButton = null;
});

palette.addEventListener("pointercancel", () => {
    activeButton = null;
    ignoreClick = false;
});

// Evita repetir la activación al soltar el dedo.
// También permite la selección mediante teclado.

palette.addEventListener("click", event => {
    if (ignoreClick && event.detail !== 0) {
        event.preventDefault();
        event.stopImmediatePropagation();
        ignoreClick = false;
        return;
    }

    const button = event.target.closest(".boton");

    if (button) {
        activeButton = null;
        selectColorButton(button);
    }
}, true);

</script>
</body>
